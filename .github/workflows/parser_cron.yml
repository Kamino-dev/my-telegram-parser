name: Auto Telegram Parser

on:
  schedule:
    # Автозапуск каждые 30 минут (24/7)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Кнопка ручного запуска на сайте GitHub

permissions:
  contents: write # Дает право серверу сохранять измененные файлы обратно в ваш репозиторий

jobs:
  run-parser:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install telethon

    - name: Run Parser Script
      env:
        API_ID: ${{ secrets.API_ID }}
        API_HASH: ${{ secrets.API_HASH }}
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        MY_CHAT_ID: ${{ secrets.MY_CHAT_ID }}
      run: |
        cd new
        python test_tg_parser.py

    - name: Commit and Push local changes (Logs/CSV)
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add new/*.csv new/*.session 2>/dev/null || true
        git diff --quiet && git diff --staged --quiet || (git commit -m "Автоматическое обновление логов и файлов сессии [skip ci]" && git push)
